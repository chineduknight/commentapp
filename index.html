<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive comments section</title>

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%92%AC</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <a class="skip-link" href="#composer">Skip to the comment box</a>

    <main id="app" class="app">
      <div class="app__bar">
        <h1 class="app__title">Comments</h1>
        <button id="reset" class="btn btn--quiet" type="button">Reset demo data</button>
      </div>

      <!-- Rendered by render.js. Nothing else in the app writes to this. -->
      <ul id="thread" class="thread" aria-label="Comments"></ul>

      <div id="composer" class="composer composer--root">
        <img id="me-avatar" class="composer__avatar" src="" alt="" />
        <label class="sr-only" for="ta-new">Add a comment</label>
        <textarea
          id="ta-new"
          class="composer__input"
          data-focus-key="new:root"
          placeholder="Add a comment..."
          rows="4"
        ></textarea>
        <div class="composer__side">
          <button class="btn" type="button" data-action="submit-new">Send</button>
        </div>
      </div>

      <div
        id="delete-modal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        hidden
      >
        <div class="modal__panel">
          <h2 id="modal-title">Delete comment</h2>
          <p>
            Are you sure you want to delete this comment? This will remove the comment and can't be
            undone.
          </p>
          <div class="modal__actions">
            <button class="btn btn--muted" type="button" data-action="cancel-delete">
              No, cancel
            </button>
            <button class="btn btn--danger" type="button" data-action="confirm-delete">
              Yes, delete
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Classic deferred scripts, executed in this order. No modules, so this
         page opens straight from the file system with no server. -->
    <script defer src="avatars.js"></script>
    <script defer src="seed.js"></script>
    <script defer src="mutations.js"></script>
    <script defer src="state.js"></script>
    <script defer src="render.js"></script>
    <script defer src="actions.js"></script>
    <script defer src="main.js"></script>
  </body>
</html>
